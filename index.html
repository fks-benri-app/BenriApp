<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="manifest.json">
    <title>Classroom通知</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Classroom通知">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        background-color: #f5f5f7;
        text-align: center;
      }
      .btn {
        background-color: #5B8DEF;
        color: white;
        border: none;
        padding: 16px 32px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 12px;
        cursor: pointer;
        width: 100%;
        max-width: 320px;
        box-sizing: border-box;
      }
      p {
        color: #777;
        font-size: 13px;
        line-height: 1.6;
        max-width: 320px;
      }
    </style>
  </head>
  <body>
    <button id="enableBtn" class="btn" style="display:none;" onclick="enableNotifications()">通知を有効にする</button>
    <p id="status"></p>

    <script>
      const FLUTTERFLOW_URL = 'https://example.com';

      const params = new URLSearchParams(window.location.search);

      // テスト用: ?reset=1 を付けて開くと、保存済みの設定を消してやり直せる
      if (params.get('reset') === '1') {
        localStorage.clear();
      }

      const studentIdFromUrl = params.get('studentId');
      if (studentIdFromUrl) {
        localStorage.setItem('studentId', studentIdFromUrl);
      }
      const studentId = localStorage.getItem('studentId');

      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "実際のApp ID",
          serviceWorkerPath: "/classroom-notify/OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/classroom-notify/" }
        });
      });

      const alreadySetup = localStorage.getItem('onesignal_setup_done') === 'true';
      const isIos = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
      const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

      if (alreadySetup) {
        redirectToApp();
      } else if (isIos && !isStandalone) {
        document.getElementById('status').innerText =
          '通知を受け取るには、まずこの画面を「ホーム画面に追加」してから、追加したアイコンを開き直してください。';
      } else if (studentId) {
        document.getElementById('enableBtn').style.display = 'block';
      } else {
        document.getElementById('status').innerText = '連携情報が見つかりません。もう一度連携をやり直してください。';
      }

      const sleep = (ms) => new Promise(r => setTimeout(r, ms));

      function enableNotifications() {
        const status = document.getElementById('status');
        status.innerText = '設定中...';

        OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.Notifications.requestPermission();
            if (!OneSignal.Notifications.permission) {
              status.innerText = '通知が許可されませんでした。ブラウザの設定から許可してください。';
              return;
            }

            await OneSignal.login(studentId);

            // サーバーへの登録が終わるまで待つ(最大10秒)
            let ok = false;
            for (let i = 0; i < 20; i++) {
              if (OneSignal.User.PushSubscription.id && OneSignal.User.externalId === studentId) {
                ok = true;
                break;
              }
              await sleep(500);
            }
            if (!ok) {
              status.innerText = '登録の確認に時間がかかっています。少し待ってから、もう一度お試しください。';
              return;
            }

            await sleep(1000);
            localStorage.setItem('onesignal_setup_done', 'true');
            status.innerText = '設定が完了しました';
            redirectToApp();
          } catch (e) {
            status.innerText = 'エラー: ' + e.message;
          }
        });
      }

      function redirectToApp() {
        window.location.href = FLUTTERFLOW_URL;
      }
    </script>
  </body>
</html>
