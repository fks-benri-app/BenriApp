<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Classroom通知</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // React が起動する前に、ダークモードのときのバーの色を反映する(白い一瞬のちらつきを防ぐ)
      // 同じく、CSS の色(テーマ)と画面の背景も先に反映する(ダークで白く一瞬光るのを防ぐ)
      try {
        if (localStorage.getItem('cn:darkMode') === '1') {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.background = '#121214';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1f1f23');
        }
      } catch (e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Classroom通知" />

    <!-- OneSignal SDK(購読処理は src/lib/onesignal.js から呼ぶ) -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
