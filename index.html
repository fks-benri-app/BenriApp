<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="manifest.json">
    <title>Classroom通知</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Classroom通知">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        background-color: #f5f5f7;
        text-align: center;
      }
      .btn {
        background-color: #5B8DEF;
        color: white;
        border: none;
        padding: 16px 32px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 12px;
        cursor: pointer;
        width: 100%;
        max-width: 320px;
        box-sizing: border-box;
      }
      p {
        color: #777;
        font-size: 13px;
        line-height: 1.6;
        max-width: 320px;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <button id="enableBtn" class="btn" style="display:none;" onclick="enableNotifications()">通知を有効にする</button>
    <p id="status"></p>

    <script>
      const VERIFY_URL = 'https://script.google.com/a/macros/g.nagano-c.ed.jp/s/AKfycbwguV9FFEgwIVen4wNaRQVgSQusf2FOiDcqih8ddDO-5NS9nvKlypVL9mI6OvesdEnT/exec'; // 匿名デプロイのURLに置き換え
      const ONESIGNAL_APP_ID = '726063a2-acd8-4d5d-9ff0-98902924cfe1';
      const FLUTTERFLOW_URL = 'https://example.com';

      const params = new URLSearchParams(window.location.search);

      // テスト用: ?reset=1 を付けて開くと、保存済みの設定を消してやり直せる
      if (params.get('reset') === '1') {
        localStorage.clear();
      }

      const codeFromUrl = params.get('code');
      if (codeFromUrl) {
        localStorage.setItem('code', codeFromUrl);
      }
      const code = localStorage.getItem('code');

      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: ONESIGNAL_APP_ID,
          serviceWorkerPath: "/classroom-notify/OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/classroom-notify/" }
        });
      });

      const alreadySetup = localStorage.getItem('onesignal_setup_done') === 'true';
      const isIos = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
      const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

      if (!navigator.onLine) {
        document.getElementById('status').innerText =
          'インターネットに接続されていません。接続後、もう一度お試しください。';
      } else if (alreadySetup) {
        redirectToApp();
      } else if (isIos && !isStandalone) {
        document.getElementById('status').innerText =
          '通知を受け取るには、まずこの画面を「ホーム画面に追加」してから、追加したアイコンを開き直してください。';
      } else if (code) {
        document.getElementById('enableBtn').style.display = 'block';
      } else {
        document.getElementById('status').innerText = '連携情報が見つかりません。もう一度連携をやり直してください。';
      }

      const sleep = (ms) => new Promise(r => setTimeout(r, ms));

      async function peekStudentId(code) {
        const res = await fetch(`${VERIFY_URL}?action=peek&code=${encodeURIComponent(code)}`);
        const data = await res.json();
        if (!data.valid) throw new Error('連携情報の確認に失敗しました(' + data.reason + ')');
        return data.studentId;
      }

      function enableNotifications() {
        const status = document.getElementById('status');
        status.innerText = '① 準備中...';

        const timer = setTimeout(() => {
          status.innerText += '\n(反応がありません。しばらくして再度お試しください)';
        }, 10000);

        OneSignalDeferred.push(async function(OneSignal) {
          try {
            status.innerText = '② 連携情報を確認しています...';
            const studentId = await peekStudentId(code);

            status.innerText = '③ 通知の許可を求めています...';
            await OneSignal.Notifications.requestPermission();
            if (!OneSignal.Notifications.permission) {
              clearTimeout(timer);
              status.innerText = '通知が許可されませんでした。ブラウザの設定から許可してください。';
              return;
            }

            status.innerText = '④ 登録中...';
            await OneSignal.login(studentId);

            let ok = false;
            for (let i = 0; i < 20; i++) {
              if (OneSignal.User.PushSubscription.id && OneSignal.User.externalId === studentId) {
                ok = true;
                break;
              }
              await sleep(500);
            }
            clearTimeout(timer);
            if (!ok) {
              status.innerText = '登録の確認に時間がかかっています。少し待ってから、もう一度お試しください。';
              return;
            }

            await sleep(1000);
            localStorage.setItem('onesignal_setup_done', 'true');
            status.innerText = '設定が完了しました';
            redirectToApp();
          } catch (e) {
            clearTimeout(timer);
            status.innerText = 'エラー: ' + e.message;
          }
        });
      }

      function redirectToApp() {
        window.location.href = FLUTTERFLOW_URL + '?code=' + encodeURIComponent(code);
      }
    </script>
  </body>
</html>
